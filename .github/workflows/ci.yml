# Controles de cada pull request (docs/calidad.md): tipos, tests unitarios,
# build de producción y tests del schema contra un Postgres de verdad.
# No usa secretos ni toca Supabase, y no despliega: el deploy lo hace Vercel
# desde main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Tipos, tests y build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tipos (tsc)
        run: npm run typecheck
      - name: Tests (vitest)
        run: npm test
      - name: Build de producción
        # Sin variables: la app arranca igual y avisa lo que falta configurar.
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  esquema:
    name: Tests del schema (Postgres 17, como Supabase)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          # Contraseña de una base descartable que solo vive en este job.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - name: Cliente de Postgres
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Migraciones y controles del schema
        run: npm run test:schema
